name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  ready:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: home
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: home_plain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U home -d home_plain_test"
          --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://home:disposable-ci-only@127.0.0.1:5432/home_plain_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm privacy:check
      - run: pnpm ready
      - name: Validate standalone demo and repeatable seed
        env:
          DATABASE_URL: postgresql://home:disposable-ci-only@127.0.0.1:5432/home_plain_test
        run: |
          pnpm demo:setup
          pnpm db:migrate
          pnpm db:migrate
          pnpm demo:seed
          pnpm demo:seed
