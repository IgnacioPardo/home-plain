name: home-plain
services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-home}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password}
      POSTGRES_DB: ${POSTGRES_DB:-home_plain}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 20
  home:
    image: home-plain:${HOME_RELEASE:-local}
    build:
      context: .
      args:
        SERVICE_VERSION: ${HOME_RELEASE:-local}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to the HTTPS preview URL}
      DATABASE_URL: postgresql://${POSTGRES_USER:-home}:${POSTGRES_PASSWORD:?Set a database password}@database:5432/${POSTGRES_DB:-home_plain}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-}
      HOUSEHOLD_ID: ${HOUSEHOLD_ID:-00000000-0000-4000-8000-000000000902}
      HOUSEHOLD_NAME: ${HOUSEHOLD_NAME:-Home}
      AUTH_SHARED_USERNAME: ${AUTH_SHARED_USERNAME:-home}
      AUTH_SHARED_PASSWORD_HASH: ${AUTH_SHARED_PASSWORD_HASH:-}
      AUTH_OWNER_USERNAME: ${AUTH_OWNER_USERNAME:-owner}
      AUTH_OWNER_PASSWORD_HASH: ${AUTH_OWNER_PASSWORD_HASH:-}
    volumes:
      - home-plain-media:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  postgres-data:
  home-plain-media:
