<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="theme-color" content="#f6f6f5" />
        <meta name="description" content="Inventario, referencias y plan de compras." />
        <title>Home</title>
        <script id="theme-init">
            (() => {
                let saved;
                try {
                    saved = localStorage.getItem("home-theme");
                } catch {
                    // Use the system preference when storage is blocked.
                }
                const theme =
                    saved === "light" || saved === "dark"
                        ? saved
                        : matchMedia("(prefers-color-scheme: dark)").matches
                          ? "dark"
                          : "light";
                document.documentElement.dataset.theme = theme;
                document.querySelector('meta[name="theme-color"]').content =
                    theme === "dark" ? "#14171c" : "#f6f6f5";
            })();
        </script>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
